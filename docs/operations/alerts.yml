##############################################################################
# travel-agent-server 告警规则（PrometheusRule / Prometheus 2.x rule_files）
#
# 指标契约与 SLO 定义见：docs/guide/observability.md
# 处置手册见：docs/operations/runbook.md（每条规则通过 runbook_url 定位到小节）
#
# 部署：
#   - Prometheus Operator：kubectl apply -f docs/operations/alerts.yml
#   - 裸 Prometheus：把 spec.groups 的内容放进 rule_files 指向的文件
#
# 部署前唯一需要替换的是 runbook_url 里的仓库地址占位符 OWNER：
#   sed -i 's|github.com/OWNER/travel-agent|github.com/<你的组织>/travel-agent|g' alerts.yml
#
# 设计原则：
#   1) 每条规则必须有 for（防抖），窗口短于抓取间隔的告警没有意义；
#   2) 比率类规则必须带分母守卫（and ... > 0），否则"没有流量"会被算成"100% 失败"；
#   3) 每条规则都有 severity / summary / description / runbook_url；
#   4) 依赖外部任务交付的指标（external.degraded）在指标缺失时静默为空 —— 不误报，但也不覆盖。
##############################################################################
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: travel-agent-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: travel-agent-server
    app.kubernetes.io/part-of: travel-agent
    prometheus: kube-prometheus
spec:
  groups:
    # ======================================================================
    # 0. 可用性与采集健康
    # ======================================================================
    - name: travel-agent.availability
      interval: 30s
      rules:
        - alert: TravelAgentServerDown
          expr: up{job="travel-agent-server"} == 0
          for: 3m
          labels:
            severity: critical
            team: travel-agent
          annotations:
            summary: "travel-agent-server 抓取目标已掉线（{{ $labels.instance }}）"
            description: >-
              Prometheus 连续 3 分钟抓不到 {{ $labels.instance }} 的 /actuator/prometheus。
              可能是进程崩溃、端口不可达、认证凭证过期（JWT）或抓取路径变更。
              先区分"进程真的挂了"与"只是抓不到"：看容器/服务状态与 /actuator/health。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#0-travelagentserverdown-p0"

        - alert: TravelLowHistogramMissing
          expr: absent(http_server_requests_seconds_bucket)
          for: 15m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "HTTP 耗时直方图缺失：P95 面板与延迟告警会静默失效"
            description: >-
              registry 里没有 http_server_requests_seconds_bucket。通常是
              management.metrics.distribution.percentiles-histogram.http.server.requests 未开启，
              或 /actuator/prometheus 未暴露。histogram_quantile 在缺少 _bucket 时返回空值——
              告警不会误报，但永远不会触发（比误报更危险）。同时确认 agent.stage / llm.latency 也开了 histogram。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#14-travellowhistogrammissing-p1"

    # ======================================================================
    # 1. 规划（Agent 核心链路）
    # ======================================================================
    - name: travel-agent.planning
      interval: 30s
      rules:
        - alert: TravelPlanOutcomeFailed
          expr: sum(rate(travel_plan_outcome_total{result="failed"}[10m])) > 0.05
          for: 10m
          labels:
            severity: critical
            team: travel-agent
          annotations:
            summary: "规划失败率异常（> 3 次/分钟，持续 10 分钟）"
            description: >-
              规划段在抛异常（travel_plan_outcome{result="failed"}）。常见原因：规则/结构化规划代码缺陷、
              LLM 适配层抛未捕获异常、数据库/外部依赖在规划期间失败。用户侧表现是"发消息后报错/无方案"。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#1-travelplanavailabilitylow-p0"

        - alert: TravelPlanAvailabilityLow
          expr: >-
            (
              sum(rate(travel_plan_outcome_total{result=~"success|degraded"}[30m]))
              /
              clamp_min(sum(rate(travel_plan_outcome_total[30m])), 1e-9)
            ) < 0.995
            and
            sum(rate(travel_plan_outcome_total[30m])) > 0
          for: 15m
          labels:
            severity: critical
            team: travel-agent
            slo: plan-availability
          annotations:
            summary: "规划可用率低于 99.5%（用户拿不到方案）"
            description: >-
              30 分钟滚动窗口内，规划成功（success+degraded）占比
              {{ $value | humanizePercentage }}，低于 SLO 99.5%。degraded 也算可用，
              因此这条只说明"用户真的拿不到方案"，优先看 failed 的日志堆栈与 5xx。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#1-travelplanavailabilitylow-p0"

        - alert: TravelPlanDegradedHigh
          expr: >-
            (
              sum(rate(travel_plan_outcome_total{result="success"}[30m]))
              /
              clamp_min(sum(rate(travel_plan_outcome_total[30m])), 1e-9)
            ) < 0.95
            and
            sum(rate(travel_plan_outcome_total[30m])) > 0
          for: 30m
          labels:
            severity: warning
            team: travel-agent
            slo: plan-health
          annotations:
            summary: "超过 5% 的规划发生降级（跳过了研究/结构化规划）"
            description: >-
              规划仍在产出方案，但超过 5% 的轮次跳过了研究取证或 LLM 结构化规划
              （agent budget 降级）。用户拿到的是"未经审核/较模板化"的方案。
              常见原因：端到端预算过紧、LLM 变慢、外部查证变慢。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#2-travelplandegradedhigh-p1"

    # ======================================================================
    # 2. 确认提交（写路径）
    # ======================================================================
    - name: travel-agent.confirm
      interval: 30s
      rules:
        - alert: TravelConfirmSuccessRateLow
          expr: >-
            (
              sum(rate(travel_confirm_outcome_total{result="success"}[10m]))
              /
              clamp_min(sum(rate(travel_confirm_outcome_total{result=~"success|failed"}[10m])), 1e-9)
            ) < 0.995
            and
            sum(increase(travel_confirm_outcome_total{result=~"success|failed"}[10m])) > 5
          for: 10m
          labels:
            severity: critical
            team: travel-agent
            slo: confirm-success
          annotations:
            summary: "确认提交成功率低于 99.5%（用户点确认后没落库）"
            description: >-
              10 分钟窗口内确认提交成功率 {{ $value | humanizePercentage }}。
              conflict 是并发/指纹/版本竞争（用户可重试），不计入分母；这里只剩"方案不存在/过期、
              风险门拒绝、提交抛异常"三类。写路径故障优先怀疑数据库事务与跨模块同步（日程/预算/足迹）。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#3-travelconfirmsuccessratelow-p0"

        - alert: TravelConfirmConflictHigh
          expr: >-
            (
              sum(rate(travel_confirm_outcome_total{result="conflict"}[30m]))
              /
              clamp_min(sum(rate(travel_confirm_outcome_total[30m])), 1e-9)
            ) > 0.02
            and
            sum(increase(travel_confirm_outcome_total[30m])) > 10
          for: 30m
          labels:
            severity: info
            team: travel-agent
          annotations:
            summary: "确认冲突率超过 2%（多标签页/重复点击/版本竞争）"
            description: >-
              30 分钟窗口内确认冲突率 {{ $value | humanizePercentage }}。用户可重试，不影响数据正确性，
              但持续偏高说明前端重复提交或多端并发改同一行程，值得做产品侧收敛。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#4-travelconfirmconflicthigh-p2"

    # ======================================================================
    # 3. SSE 流式链路
    # ======================================================================
    - name: travel-agent.sse
      interval: 30s
      rules:
        - alert: TravelSseAbnormalDisconnectHigh
          expr: >-
            (
              sum(rate(sse_disconnects_total{reason=~"error|timeout"}[10m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{uri="/api/agent/stream"}[10m])), 1e-9)
            ) > 0.01
            and
            sum(rate(http_server_requests_seconds_count{uri="/api/agent/stream"}[10m])) > 0
          for: 10m
          labels:
            severity: critical
            team: travel-agent
            slo: sse-stability
          annotations:
            summary: "SSE 异常中断率超过 1%（error/timeout）"
            description: >-
              10 分钟窗口内 error/timeout 断连占流式请求的 {{ $value | humanizePercentage }}。
              这类中断是服务端/网络故障（不是用户切页）。查反向代理/网关读超时（SSE 需要关闭
              响应缓冲并放大 read timeout）、容器存活探针重启、事件循环线程池耗尽。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#5-travelsseabnormaldisconnecthigh-p0"

        - alert: TravelSseClientAbortHigh
          expr: >-
            (
              sum(rate(sse_disconnects_total{reason="complete"}[30m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{uri="/api/agent/stream"}[30m])), 1e-9)
            ) > 0.10
            and
            sum(rate(http_server_requests_seconds_count{uri="/api/agent/stream"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "SSE 客户端中断率超过 10%（用户在流结束前关页面/断网）"
            description: >-
              30 分钟窗口内客户端半途断开占 {{ $value | humanizePercentage }}。
              多数是产品行为（用户等不及/切页）。若同时段规划变慢（见 TravelPlanStageLatencyP95High），
              说明根因是"太慢导致用户离开"，应优先修慢而不是修断连。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#6-travelsseclientaborthigh-p1"

    # ======================================================================
    # 4. 外部依赖降级（指标由 T3 韧性任务提供）
    # ======================================================================
    - name: travel-agent.external
      interval: 30s
      rules:
        - alert: TravelExternalDegradedHigh
          expr: >-
            (
              sum(rate(external_degraded_total[10m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count[10m])), 1e-9)
            ) > 0.05
            and
            sum(rate(http_server_requests_seconds_count[10m])) > 0
          for: 10m
          labels:
            severity: warning
            team: travel-agent
            slo: external-degradation
          annotations:
            summary: "外部依赖降级率超过 5%（每请求降级次数）"
            description: >-
              10 分钟窗口内，平均每个 HTTP 请求触发 {{ $value }} 次外部依赖降级
              （external_degraded_total）。服务仍可用，但方案质量在下降：路线/POI 回落估算，
              天气拿不到时依赖天气的修改会被明确拒绝（503，不生成方案）。
              按 provider 拆开看是哪一家：rate(external_degraded_total[10m]) by (provider, reason)。
              该指标由韧性任务（T3）提供；未合入时本告警不会触发。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#7-travelexternaldegradedhigh-p1"

        - alert: TravelExternalProviderDegraded
          expr: sum by (provider) (rate(external_degraded_total[15m])) > 0.2
          for: 15m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "外部依赖 {{ $labels.provider }} 持续降级（> 0.2 次/秒）"
            description: >-
              provider={{ $labels.provider }} 连续 15 分钟每秒降级超过 0.2 次。
              单家依赖长时间降级通常意味着 Key 失效/额度耗尽/上游故障，而不是偶发抖动。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#7-travelexternaldegradedhigh-p1"

    # ======================================================================
    # 5. 延迟（P95）
    # ======================================================================
    - name: travel-agent.latency
      interval: 30s
      rules:
        - alert: TravelHttpLatencyP95High
          expr: >-
            histogram_quantile(
              0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/api/agent/stream"}[5m]))
            ) > 0.8
          for: 10m
          labels:
            severity: warning
            team: travel-agent
            slo: api-latency
          annotations:
            summary: "HTTP P95 超过 800ms（排除 SSE 长连接）"
            description: >-
              5 分钟窗口 P95 = {{ $value }}s。SSE（/api/agent/stream）被排除，因为它的耗时等于整个会话时长。
              注意 /api/agent/chat 同步规划本身可能到几十秒（受 30s 预算约束），
              它被包含在这条规则里时更容易触发 —— 先看 uri 维度定位是哪个接口。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#8-travelhttplatencyp95high-p1"

        - alert: TravelPlanStageLatencyP95High
          expr: >-
            histogram_quantile(
              0.95,
              sum by (le) (rate(agent_stage_seconds_bucket{stage="plan"}[5m]))
            ) > 25
          for: 10m
          labels:
            severity: warning
            team: travel-agent
            slo: plan-latency
          annotations:
            summary: "规划阶段 P95 超过 25s（总预算 30s 的 80%）"
            description: >-
              agent.stage{stage="plan"} 的 P95 = {{ $value }}s。规划吃掉 80% 预算后，
              审核/润色几乎必然被降级（触发 TravelPlanDegradedHigh）。
              先看 llm.latency（模型变慢）与外部工具耗时（路线/天气），再看结构化规划的重试。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#9-travelplanstagelatencyp95high-p1"

    # ======================================================================
    # 6. LLM 调用与成本
    # ======================================================================
    - name: travel-agent.llm
      interval: 30s
      rules:
        - alert: TravelLlmFailureHigh
          expr: >-
            (
              sum(rate(llm_calls_total{result="failed"}[10m]))
              /
              clamp_min(sum(rate(llm_calls_total{result=~"ok|failed"}[10m])), 1e-9)
            ) > 0.10
            and
            sum(rate(llm_calls_total{result=~"ok|failed"}[10m])) > 0.01
          for: 10m
          labels:
            severity: critical
            team: travel-agent
          annotations:
            summary: "LLM 调用失败率超过 10%（已全面降级到规则路径）"
            description: >-
              10 分钟窗口 LLM 失败率 {{ $value | humanizePercentage }}。服务仍可用（规则模板兜底），
              但意图识别/结构化规划/文案润色都会退化。常见原因：Key 失效或余额耗尽（402）、
              供应商 5xx、读超时（30s）、网络/DNS。看 llm.calls{result="skipped"} 区分"没配 Key"。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#10-travelllmfailurehigh-p0"

        - alert: TravelLlmQuotaRejectedHigh
          expr: >-
            (
              sum(rate(llm_calls_total{result="quota"}[30m]))
              /
              clamp_min(sum(rate(llm_calls_total[30m])), 1e-9)
            ) > 0.05
            and
            sum(rate(llm_calls_total[30m])) > 0.01
          for: 30m
          labels:
            severity: info
            team: travel-agent
          annotations:
            summary: "LLM 配额拒绝率超过 5%（travel.llm.quota-daily-limit 生效中）"
            description: >-
              30 分钟窗口配额拒绝 {{ $value | humanizePercentage }}。
              要么是配额配置过紧（正常用户被挡），要么是有账号滥用；先按用户维度看日志再谈调额。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#11-travelllmquotarejectedhigh-p2"

        - alert: TravelLlmCostBudgetHigh
          expr: sum(rate(travel_llm_cost_usd_total[1h])) * 3600 > 2
          for: 1h
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "LLM 成本超过 2 USD/小时（单实例）"
            description: >-
              1 小时窗口折合 {{ $value }} USD/h。单价由 travel.llm.prompt-price-per-1k-usd /
              travel.llm.completion-price-per-1k-usd 配置；默认 0 时该指标不存在、本告警不会触发。
              排查方向：单次规划 token 暴涨（prompt 变长/研究循环步数变多）、重试风暴、异常账号刷量。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#12-travelllmcostbudgethigh-p1"

    # ======================================================================
    # 7. RAG 与限流
    # ======================================================================
    - name: travel-agent.rag
      interval: 30s
      rules:
        - alert: TravelRagHitRateLow
          expr: >-
            (
              sum(rate(travel_rag_retrieval_total{result="hit"}[30m]))
              /
              clamp_min(sum(rate(travel_rag_retrieval_total[30m])), 1e-9)
            ) < 0.30
            and
            sum(increase(travel_rag_retrieval_total[30m])) > 10
          for: 30m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "RAG 命中率低于 30%（知识库可能没被用上）"
            description: >-
              30 分钟窗口命中率 {{ $value | humanizePercentage }}。miss 既可能是"知识库真没资料"，
              也可能是索引未加载（RagBootstrap 失败）、embedding 服务异常、版本回滚后索引未 reload。
              对比启动日志与 /api/knowledge 的文档数再判断。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#13-travelraghitratelow-p1"

        - alert: TravelRateLimitFailOpen
          expr: increase(ratelimit_failopen_total[15m]) > 0
          for: 5m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "Redis 限流持续 fail-open（限流已失效）"
            description: >-
              15 分钟内出现 {{ $value }} 次限流 fail-open：Redis 不可用，请求被放行。
              这是刻意的 fail-open（限流不该把站点打挂），但意味着登录/上传/Agent 配额当前没有保护。
              查 Redis 连通性与连接池，必要时切 RATE_LIMIT_STORE=memory 止血。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#15-travelratelimitfailopen-p1"

    # ======================================================================
    # 8. 可靠执行链路（阶段三：Outbox / ABANDONED / 租约清扫）
    # ======================================================================
    - name: travel-agent.reliability
      interval: 30s
      rules:
        - alert: TravelOutboxDeadPresent
          expr: max(outbox_status{status="dead"}) > 0
          for: 10m
          labels:
            severity: critical
            team: travel-agent
          annotations:
            summary: "Outbox 存在 DEAD 待办：确认后的同步工作已死，需要人工介入"
            description: >-
              至少 1 条 plan_outbox 行处于 DEAD（重试耗尽）并持续 10 分钟。用户看到"已确认"，
              但日程/预算快照/足迹可能没有同步。先看该行 last_error 与 attempts，修复根因后
              通过 POST /api/agent/executions/{id}/retry 或人工复核补投；不要直接改状态掩盖证据。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#16-traveloutboxdeadpresent-p0"

        - alert: TravelOutboxBacklogHigh
          expr: max(outbox_status{status="pending"}) > 100
          for: 15m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "Outbox PENDING 积压超过 100 条（投递器可能停摆或持续失败）"
            description: >-
              待投递行数持续 15 分钟超过 100。先确认投递器是否在跑（日志里的
              "Outbox 投递"轮次）、下游模块是否在持续抛错；积压期间用户的确认结果会"已提交但未同步"，
              不要用清空 next_attempt_at 掩盖退避。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#17-traveloutboxbackloghigh-p1"

        - alert: TravelAgentRunAbandoned
          expr: increase(agent_run_abandoned_total[30m]) > 0
          for: 5m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "30 分钟内出现 ABANDONED 运行：结果未知，用户需要重试"
            description: >-
              恢复任务把 {{ $value }} 个心跳超时的 RUNNING 判为 ABANDONED。执行体已不存在、
              结果未知（可能是进程崩溃/重启/OOM），与执行体自报的 FAILED 不同。
              先看 Pod 重启与 OOM 记录，再看这些 run 的心跳停在哪一阶段。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#18-travelagentrunabandoned-p1"

        - alert: TravelPendingPlanSweptHigh
          expr: increase(pending_plan_swept_total[30m]) > 5
          for: 10m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "确认租约连续被清扫（>5 次/30 分钟）：确认提交在崩溃或超时"
            description: >-
              过期 CONFIRMING 被清扫回 PENDING 的次数异常。每次清扫都意味着一次确认提交
              没有在租约内完成（进程崩溃/DB 慢/提交耗时超过 travel.pending-plan.lease-minutes）。
              查 DB 延迟、确认提交耗时与进程重启；不要把租约一味调大。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#19-travelpendingplanswepthigh-p1"

    # ======================================================================
    # 9. MCP 逐 server 治理（熔断 / 失败率）
    #
    # 指标来源：McpGovernanceMetrics（Gauge，每次抓取现读 McpGovernor 快照）。
    # 计数本体在治理闸门里单调递增，Gauge 只是「抓取时的读数」，所以下面照常写 rate()/increase()；
    # 进程重启归零会被 Prometheus 按 counter 重置处理（# TYPE 标成 gauge 不影响这些函数）。
    # 闸门不可观测时（MCP 未启用 / 桥接未启动 / server 不在快照）序列是 NaN：
    # ==1 与 >0.3 都不会命中 —— 既不会把「查不到」当成故障，也不会当成健康。
    # ======================================================================
    - name: travel-agent.mcp
      interval: 30s
      rules:
        - alert: TravelMcpCircuitOpen
          # 为什么 for: 5m：冷却结束（cooldown-ms 默认 60s）后第一次调用即半开探测，成功就闭合；
          # 连续 5 个冷却周期仍是 open，说明探测持续失败，或者该 server 一直没人调用——
          # 后者同样等于「工具对模型不可用」，值得看一眼而不是静默。
          # 为什么要 == 1：熔断是三态 gauge（closed/open/half_open，命中 1 其余 0），
          # 半开探测期间 open 会变 0，恢复动作自动解除本告警，不需要人工 resolve。
          # 为什么保留 instance：熔断器是「每实例一份」（McpGovernor 在进程内），
          # 用 max by (server, instance) 而不是只按 server 聚合——聚掉 instance 就不知道该去哪台机器看日志；
          # 单实例部署时它与 max by (server) 完全等价。
          expr: max by (server, instance) (mcp_server_circuit{state="open"}) == 1
          for: 5m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "MCP server {{ $labels.server }} 熔断打开（{{ $labels.instance }}）：该 server 的工具已被治理闸门摘掉"
            description: >-
              travel.mcp.servers[] 里的 {{ $labels.server }} 已连续 5 分钟处于熔断打开状态
              （failure-threshold 默认 0 = 未启用熔断，此时本规则不会触发）。
              打开期间所有调用被快速拒绝（503），模型只能换 server 或退回内置工具。
              判读三件事：rate(mcp_server_failures[10m]) 还在涨 = 上游真故障；
              rate(mcp_server_rejected[10m]) 涨而 mcp_server_calls 不动 = 模型正在被拒绝（真正的影响面）；
              两者都不动 = 冷却期结束后还没被探测过，先触发一次调用再判断，别急着当故障。
              mcp_server_connected=0 表示这是「接入失败」而不是运行时熔断，修法不同（见 §20）。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#20-travelmcpcircuitopen-p1"

        - alert: TravelMcpServerFailureRateHigh
          # 为什么是 30%：MCP 工具是「模型主动挑的一个数据源」，偶发一次超时/上游 5xx 不该叫人；
          # 持续三成以上失败意味着这个 server 基本不可用，而模型还在反复重试（烧工具次数与时间预算）。
          # 为什么要 increase(calls) >= 5 的小样本保护：分母只有 1–4 次调用时，单次失败就是 100%，
          # 一次抖动会在 10m 窗口里冒充「全面失败」；攒够 5 个样本再判，阈值才有意义。
          # 为什么按 (server, instance) 而不是只按 server 聚合：分子分母必须来自同一实例——
          # 跨实例相加会把实例 A 的失败摊薄进实例 B 的成功里（A 全挂、B 正常 → 看板显示失败率很低）。
          expr: >-
            (
              sum by (server, instance) (rate(mcp_server_failures[10m]))
              /
              clamp_min(sum by (server, instance) (rate(mcp_server_calls[10m])), 1e-9)
            ) > 0.3
            and
            sum by (server, instance) (increase(mcp_server_calls[10m])) >= 5
          for: 10m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "MCP server {{ $labels.server }} 失败率超过 30%（{{ $labels.instance }}，10 分钟内至少 5 次调用）"
            description: >-
              10 分钟窗口内 {{ $labels.server }} 的调用失败率 {{ $value | humanizePercentage }}。
              分母只含「被放行并执行」的调用：白名单/配额/熔断拒绝记在 mcp_server_rejected，
              不进失败率，所以这条不会因为闸门收紧而虚高（那是另一种故障，见 TravelMcpCircuitOpen）。
              常见原因：上游超时/额度耗尽（高德 10021）、Key 失效、工具参数 schema 变化导致模型传参一直失败、
              网络/DNS。失败率下降但 calls 同时归零只是「没人用」，不是恢复——用
              increase(mcp_server_calls[10m]) 确认样本仍在。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#21-travelmcpserverfailureratehigh-p1"

        - alert: TravelMcpQuotaPressureHigh
          # 为什么需要这条：配额耗尽不是「慢」，是 503 直接拒绝——模型这一轮就再也拿不到该 server 的工具，
          # 用户看到的是方案少了路线/POI。等 rejected 涨起来才发现，已经有一批请求降级了。
          # 为什么是 90%：max-calls-per-minute 是硬上限，接近上限时窗口内任一次突发都会立刻触顶；
          # 留 10% 余量做「扩容/调参/降并发」的动作时间，而不是等到撞墙。
          # 为什么 for: 5m：闸门窗口是固定 60s，单分钟冲到 90% 可能只是瞬时突发（下一分钟就回落）；
          # 连续 5 个窗口都在 90% 以上才是「结构性不够用」，这条告警要的是后者。
          # 分母 clamp_min(..., 1e-9) 防除零；两条序列都是 NaN 时结果为 NaN，不会命中 > 0.9——
          # 「没配配额」与「配额充足」都不会误报。
          expr: >-
            (
              mcp_server_calls_this_minute
              /
              clamp_min(mcp_server_quota, 1e-9)
            ) > 0.9
          for: 5m
          labels:
            severity: warning
            team: travel-agent
          annotations:
            summary: "MCP server {{ $labels.server }} 每分钟配额已用 {{ $value | humanizePercentage }}（{{ $labels.instance }}）"
            description: >-
              {{ $labels.server }} 在当前 60 秒窗口内已用掉 {{ $value | humanizePercentage }} 的
              max-calls-per-minute 配额，且已持续 5 个窗口。继续下去会开始返回 503，
              模型在该 server 上「想调用也调不到」，方案里会缺对应数据。
              处置顺序：先看 rate(mcp_server_calls[10m]) 是否真涨（是真实负载体量，不是重试风暴）→
              调大 max-calls-per-minute 或降低并发 → 收窄 allow-tools 让模型少试几个工具并禁用最吵的那个工具。
              不要用「调大 failure-threshold」应付（那是熔断阈值，与配额无关）。
              未配置配额时本规则不会触发（两条序列为 NaN）。
            runbook_url: "https://github.com/OWNER/travel-agent/blob/main/docs/operations/runbook.md#22-travelmcpquotapressurehigh-p1"

