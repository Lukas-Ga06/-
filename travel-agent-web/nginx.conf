# 访问日志只记 $uri（不含查询串）：SSE / 照片原图用 ?ticket=... 做短期只读票据，
# 默认的 $request 会把票据写进 `docker compose logs web`，任何能看日志的人都能重放。
# log_format 必须位于 http 上下文（本文件会被 include 到 http{} 内），不能写进 server{}。
log_format without_args '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log without_args;

    root /usr/share/nginx/html;
    index index.html;

    # 照片/发票上传体积对齐后端 multipart 上限（10MB 文件 / 12MB 请求）
    client_max_body_size 12m;

    # SSE 流式对话：关闭缓冲、拉长超时，避免事件被代理攒批或提前断开
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 只写真实源地址：$proxy_add_x_forwarded_for 会把客户端自带的 X-Forwarded-For 原样保留并追加，
        # 后端若采信左侧段就等于让客户端伪造"客户端 IP"（限流可被无限绕过）。覆盖而不是追加，
        # 让最右侧一跳恒为 nginx 看到的真实对端地址。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 地图引擎按需加载（dist/vendor/maplibre/<version>/）。
    # nginx 1.27 自带的 mime.types 没有 .mjs，默认会发 application/octet-stream，
    # 浏览器据此拒绝执行 ES module → 足迹地图永远走「加载失败」降级。
    # 这里显式声明 .mjs 为 text/javascript，并只缓存带版本号的目录。
    location ^~ /vendor/maplibre/ {
        types {
            text/javascript mjs;
        }
        default_type text/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退（React Router 刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存：带 hash 的 assets 长缓存，index.html 不缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
