# 可选的基础设施：切换 MySQL / Redis 时使用
#   docker compose up -d
#   后端启动参数：--spring.profiles.active=mysql

services:
  mysql:
    # 与生产 docker-compose.yml 同为 8.4（原 8.0 会造成「开发 8.0 / 验收与生产 8.4」的版本漂移）。
    # 已有 8.0 数据卷首次用 8.4 启动会就地升级数据目录，且**不能降回 8.0**；
    # 需要保留旧卷可先 mysqldump 备份。生产侧另显式设 utf8mb4_unicode_ci，本文件不设，
    # 因此本地新库用 8.4 默认 utf8mb4_0900_ai_ci —— 只是本地开发口径差异，勿据本地 collation 调生产 SQL。
    image: mysql:8.4
    container_name: travel-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: travel_agent
    ports:
      - "3306:3306"
    volumes:
      # 不再挂载 sql/init.sql：schema 的唯一权威已改为 Flyway（V1 基线 + V2.. 增量）。
      # 若仍用它初始化，会建出旧列型（health_record.weight=DECIMAL、operation_history.*=JSON 等），
      # 与 application-mysql.yml 的 ddl-auto=validate 冲突 → 后端直接启动失败。
      # 库本身由下面的 MYSQL_DATABASE 创建，表由后端首次启动的 Flyway 建。
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: travel-agent-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
