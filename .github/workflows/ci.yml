name: CI

# 发布门禁的唯一权威入口：本地等价命令见 docs/guide/ci.md。
# 拆分原则：能在一次 job 里跑完的不拆；需要外部服务（MySQL）或独立权限（CodeQL）的单独成 job。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend / mvn verify（测试 + 覆盖率 + Checkstyle + SpotBugs）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-agent-server
    env:
      # 业务时区：pom 的 surefire argLine 已钉 -Duser.timezone，这里再给 job 级 TZ 兜住
      # Maven 自身与任何派生进程（日期相关的断言曾因 UTC runner 整体偏一天）
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      # GuidebookPdfTest 会真的渲染中文 PDF：runner 默认无 CJK 字体，
      # 缺字体会让该用例以「服务器未找到可用的中文字体」失败（生产镜像已装，属环境对齐）
      - name: Install CJK fonts (GuidebookPdfTest)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # verify = 单元测试 + JaCoCo check + Checkstyle + SpotBugs，任一不过即失败。
      # 真实 MySQL 迁移不在这一步：见 mysql-migration job（需要 service container）。
      - name: Maven verify
        run: mvn -B verify

      - name: Upload coverage and static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            travel-agent-server/target/site/jacoco/
            travel-agent-server/target/spotbugsXml.xml
            travel-agent-server/target/checkstyle-result.xml
          retention-days: 7

  mysql-migration:
    name: Backend / 真实 MySQL Flyway 迁移 + Hibernate validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-agent-server
    env:
      TZ: Asia/Shanghai
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 该测试默认被 @EnabledIfEnvironmentVariable(MYSQL_IT=true) 跳过；
      # 这里显式开启，用 service container 的 3306（本地便携实例是 3307）。
      # 测试自己建一次性库 travel_agent_it_<ts>，不碰其他库；需要 CREATE DATABASE 权限，故用 root。
      - name: Run Flyway migration test
        env:
          MYSQL_IT: 'true'
          MYSQL_IT_HOST: 127.0.0.1
          MYSQL_IT_PORT: '3306'
          MYSQL_IT_USERNAME: root
          MYSQL_IT_PASSWORD: root
        run: mvn -B -Dtest=MySqlFlywayMigrationTest test

      - name: Upload migration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-migration-logs
          path: travel-agent-server/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend / typecheck + lint + format + coverage + build budget + 契约类型
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-agent-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: travel-agent-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # 覆盖率阈值写在 vitest.config.ts（全局），核心目录另由 scripts/check-core-coverage.mjs 卡。
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Core directory coverage gate
        run: node scripts/check-core-coverage.mjs

      # build:check = tsc + vite build + scripts/check-bundle-budget.mjs（包体预算与地图 vendor 断言）
      - name: Production build + bundle budget
        run: npm run build:check

      # 生成类型须与 docs/api/openapi.json 快照一致（快照与后端一致性由 contract job 负责）
      - name: API contract type drift check
        run: npm run api:check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            travel-agent-web/coverage/
            travel-agent-web/dist/bundle-stats.html
          retention-days: 7

  contract:
    name: Contract / OpenAPI 快照一致 + 破坏性变更
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-agent-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 用当前代码重新生成快照；若与提交的 docs/api/openapi.json 有差异，说明改了 DTO/Controller
      # 却没更新契约。git diff --exit-code 会把这种漂移变成构建失败。
      - name: Regenerate OpenAPI snapshot
        run: mvn -B -Dtest=OpenApiSnapshotTest -Dopenapi.update=true test

      - name: Fail if snapshot drifted
        run: git diff --exit-code -- ../docs/api/openapi.json

      - name: Download oasdiff
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          VERSION=1.11.7
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${VERSION}/oasdiff_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz oasdiff
          sudo mv oasdiff /usr/local/bin/oasdiff
          oasdiff --version

      # 破坏性变更检查：以 base 分支的快照为基线。首版没有基线文件时跳过（不阻塞首次引入）。
      - name: Breaking API change check
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git show "origin/${{ github.base_ref }}:docs/api/openapi.json" > /tmp/openapi-base.json || {
            echo "::notice::base 分支没有 docs/api/openapi.json，跳过破坏性变更检查（首次引入契约）"
            exit 0
          }
          oasdiff breaking /tmp/openapi-base.json ../docs/api/openapi.json --fail-on ERR

  docs:
    name: Docs / 链接与命令引用校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 零依赖脚本：校验相对链接是否存在、文档里的 npm run <script> / mvn <goal> 是否真实可用。
      - name: docs-check（链接 + 命令引用）
        run: node scripts/docs-check.mjs

      # lychee 只查本地/相对链接；外链容易受网络与对方站点变更影响，放 scheduled（见 lychee.toml 注释）。
      - name: lychee（offline，仅本地链接）
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            README.md
            docs/**/*.md
          fail: true

  security:
    name: Security / 依赖漏洞
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      # PR 上只对新增依赖做漏洞评审，避免历史存量债务把每个 PR 都卡死。
      #
      # 2026-11-24 起仓库已改为 Public 并开启 Dependency graph（SBOM 可读），
      # dependency-review 不再需要 continue-on-error 兜底：缺开关时它会以
      # "not supported on this repository" 直接失败，而这正是应该被看见的信号。
      # 原注释里的「启用 Dependency graph 后删掉 continue-on-error」已于本 PR 执行；
      # 真正的依赖门禁仍是下面的 npm audit 与 Trivy，这里补齐「PR 新增依赖」这一层。
      - name: Dependency review（PR 新增依赖）
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: travel-agent-web/package-lock.json

      # 前端依赖漏洞：high/critical 阻断。当前存量（vite-plugin-pwa 的 glob/minimatch moderate）
      # 低于该级别，不会误伤；升级后应把级别收紧到 moderate，见 docs/guide/ci.md。
      - name: npm audit（high+）
        working-directory: travel-agent-web
        run: npm ci --ignore-scripts && npm audit --audit-level=high

      # Maven 依赖漏洞：Trivy 扫依赖清单，忽略「无修复版本」的条目，避免无解除的告警常驻红灯。
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: travel-agent-server
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          # 临时豁免（Spring 6.2.x 两条 CRITICAL，上游 6.2.20 尚未发布）：
          # 条目与到期见 travel-agent-server/.trivyignore.yaml，流程见 docs/guide/ci.md §6。
          trivyignores: travel-agent-server/.trivyignore.yaml

  # 密钥扫描：平台侧 Secret scanning 之外再加一道**本地可复现**的门禁。
  # 用固定版本 CLI 而不是第三方 action：版本与校验和都钉死，扫描范围与「改公开前扫全历史」
  # 和文档里的本地命令逐字一致（gitleaks git --log-opts=--all -c .gitleaks.toml）。
  secret-scan:
    name: Security / gitleaks 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全历史：只取浅克隆会让「更早提交里漏过的密钥」永远看不见。
          fetch-depth: 0

      - name: gitleaks（全历史 + 仓库配置）
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          # --redact：命中内容不写进日志；--all：扫所有 ref 可达提交。
          # 放行项只在 .gitleaks.toml 里按具体测试值/占位符声明，不按目录整体排除。
          ./gitleaks git --redact --no-banner --log-opts="--all" -c .gitleaks.toml

  e2e:
    name: E2E / Playwright smoke（后端 H2 + 前端 preview）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: travel-agent-web/package-lock.json

      # 路书 PDF 导出需要 CJK 字体（TripGuidebookService.findCjkFont 找不到字体时抛 500）。
      # 生产镜像已装 fonts-noto-cjk，这里让 CI 与生产对齐，否则「登录→建行程→路书」会以
      # 「服务器未找到可用的中文字体」失败，而那属于环境缺失、不是代码缺陷。
      - name: Install CJK fonts (PDF export parity with production image)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # 后端不再用 `mvn spring-boot:run` 常驻：那条路径会读 travel-agent-server/.env.local，
      # 把真实 LLM/高德 Key 带进 e2e（2026-11-22 device 套件 19/21 的根因）。
      # 现在由 `npm run e2e:isolated` 让 Playwright 拉起 scripts/start-e2e-backend.mjs：
      # 独立 H2 内存库 + LLM/Embedding/MCP/AMAP 全关 + 限流关闭，且不读开发者 .env.local。
      # 这里只先构建 jar，避免 webServer 里再跑一次 mvn package 拖长启动超时。
      - name: Build backend jar (isolated e2e)
        working-directory: travel-agent-server
        run: mvn -B -q -Dmaven.test.skip=true package

      - name: Install frontend dependencies
        working-directory: travel-agent-web
        run: npm ci

      - name: Build frontend
        working-directory: travel-agent-web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: travel-agent-web
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke（隔离后端：H2 + 无真实 LLM/MCP/外部 Key）
        working-directory: travel-agent-web
        env:
          E2E_ASSERT_ISOLATION: '1'
        run: npm run e2e:isolated

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            .e2e/isolated/backend.log
            travel-agent-web/test-results
            travel-agent-web/playwright-report
          retention-days: 7
  # 移动端 / 弱网 / 多端并发：已改用隔离后端（H2 内存库 + LLM/MCP/AMAP 全关），
  # 但**仍保持观察模式（continue-on-error）**：剩下的不确定性是共享 runner 上
  # WebKit 与弱网耗时阈值的抖动，不是外部 Key 污染。
  # 转正条件（写进 docs/guide/ci.md，2026-12-06 前复盘）：
  #   1) 连续 2 周在隔离后端上无「只有 CI 红、本地绿」的抖动；
  #   2) PR 模板已写明「Playwright WebKit 模拟 ≠ 真实 iOS Safari」。
  # 不得并入上面的 `e2e` job —— 桌面门禁口径保持稳定。
  e2e-device:
    name: E2E / 移动端(WebKit) + 弱网(CDP) + 多端并发（隔离后端，观察中）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: travel-agent-web/package-lock.json

      # 与 e2e job 同款：先补 CJK 字体，否则路书 PDF 用例会因环境缺字体失败
      - name: Install CJK fonts (PDF export parity with production image)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # 与 e2e job 同一套隔离后端：Playwright 拉起 scripts/start-e2e-backend.mjs，
      # 不读开发者 .env.local，也不启动 8080 上的真实 provider 实例。
      - name: Build backend jar (isolated e2e)
        working-directory: travel-agent-server
        run: mvn -B -q -Dmaven.test.skip=true package

      - name: Install frontend dependencies
        working-directory: travel-agent-web
        run: npm ci

      - name: Build frontend
        working-directory: travel-agent-web
        run: npm run build

      # webkit 必须显式安装：主 e2e job 只装了 chromium
      - name: Install Playwright browsers (chromium + webkit)
        working-directory: travel-agent-web
        run: npx playwright install --with-deps chromium webkit

      # device = 13 条主冒烟 + 8 条新增（移动端 3 / 弱网 3 / 多端并发 2），全部跑隔离后端
      - name: Run device suites（隔离后端）
        working-directory: travel-agent-web
        env:
          E2E_ASSERT_ISOLATION: '1'
        run: npm run e2e:device:isolated

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-device-artifacts
          path: |
            .e2e/isolated/backend.log
            travel-agent-web/test-results
            travel-agent-web/playwright-report
          retention-days: 7

  # 视觉回归：与生成器用同一个 Playwright 官方镜像（浏览器/字体/依赖固定），
  # 只有仓库里存在 `*-chromium-linux.png` 基线时才真正比较；没有基线时只发 notice，
  # 不制造“看起来跑过了”的假绿。
  # 当前 continue-on-error=true（观察）：Linux 基线需要先由 visual-baseline.yml 生成并提交，
  # 首次比较通过后再转硬门禁，条件见 docs/guide/ci.md。
  visual:
    name: Visual / 11 页截图回归（Linux 基线，观察中）
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      options: --ipc=host
    defaults:
      run:
        working-directory: travel-agent-web
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Detect Linux baseline
        id: baseline
        run: |
          if ls e2e/visual/pages.spec.ts-snapshots/*-chromium-linux.png >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库里还没有 *-chromium-linux.png 视觉基线；请先运行 Visual baseline (Linux) workflow 并提交产物。"
          fi

      - name: Build frontend
        if: steps.baseline.outputs.present == 'true'
        run: npm run build

      - name: Compare snapshots (Linux)
        if: steps.baseline.outputs.present == 'true'
        run: npm run test:visual

      - name: Upload visual diff on failure
        if: failure() && steps.baseline.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            travel-agent-web/test-results
            travel-agent-web/playwright-report
          retention-days: 7
