server:
  port: 8080

spring:
  application:
    name: travel-agent-server
  config:
    # 本地密钥文件（KEY=VALUE，已被 .gitignore 忽略）。
    # 用 [.properties] 强制按 properties 解析，这样 java -jar / mvn spring-boot:run
    # 也能自动读到 LLM_API_KEY，不必依赖 run-dev.ps1。
    # 环境变量优先级更高，生产上仍以环境变量为准。
    import: optional:file:./.env.local[.properties]
  servlet:
    multipart:
      # 行程照片上传上限
      max-file-size: 10MB
      max-request-size: 12MB
  # 默认使用 H2 文件数据库，开箱即用；生产/正式环境切换 MySQL：
  # 启动参数加 --spring.profiles.active=mysql（配置见 application-mysql.yml）
  datasource:
    url: jdbc:h2:file:./data/travel-agent;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    # 存量库（已有表）自动打 baseline，跳过历史版本，只执行增量脚本；
    # 全新库由 ddl-auto 建表 + 顺序执行 db/migration 增量。今后改 schema 一律加 V*__ 脚本。
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Shanghai

management:
  endpoints:
    web:
      # 只暴露必要端点：health 给探活，metrics 给排障（需登录）
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # data-redis 引入后 Boot 会自动加 Redis 健康检查；Redis 仅用于限流计数（fail-open），
      # 不可用不应把整站标为 DOWN。需要 Redis 健康监控时再打开
      enabled: false

travel:
  # 应用时区：代码里的“今天/明天”都基于它（默认 Asia/Shanghai，避免容器 UTC 导致日期偏移一天）
  timezone: ${APP_TIMEZONE:Asia/Shanghai}
  demo-account:
    # 演示账号 demo/demo123（README 快速启动用）。生产部署必须设 DEMO_ACCOUNT=false 关闭
    enabled: ${DEMO_ACCOUNT:true}
  invoices:
    # 上传的发票原始文件
    dir: ${INVOICE_DIR:data/invoices}
  ocr:
    # 图片发票 OCR：Tesseract 可执行文件路径（不配置时仅支持 PDF 电子发票与粘贴文本）
    tesseract: ${TESSERACT_CMD:}
    # 语言包目录，需包含 chi_sim.traineddata 与 eng.traineddata
    tessdata: ${TESSDATA_PREFIX:}
  photos:
    # 行程照片落盘目录（相对后端模块）
    dir: data/photos
    # 单行程照片张数上限
    max-per-trip: ${PHOTO_MAX_PER_TRIP:200}
    # 单用户照片总容量上限（字节，默认 500MB）
    max-bytes-per-user: ${PHOTO_MAX_BYTES_PER_USER:524288000}
  rate-limit:
    # 简单限流：登录/注册按 IP，Agent 与上传按用户，窗口内超过阈值返回 429
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-limit: ${RATE_LIMIT_AUTH:10}
    agent-limit: ${RATE_LIMIT_AGENT:30}
    upload-limit: ${RATE_LIMIT_UPLOAD:60}
    default-limit: ${RATE_LIMIT_DEFAULT:600}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:300}
  amap:
    # 高德开放平台 Web服务 Key（lbs.amap.com 免费申请，类型选"Web服务"）。
    # 配置后启用快速路径：大模型精简生成(~2-3s) + 高德批量定位(~1s，国内可达)。
    # 留空则自动退回兜底路径（大模型直接生成坐标，约 6-15 秒）。也可用环境变量 AMAP_KEY 覆盖。
    key: ${AMAP_KEY:}
  weather:
    # 真实天气（Open-Meteo，免费无需 Key）：设 WEATHER_REAL=true 开启；
    # 网络失败或超出预报范围（过去 / 16 天外）自动降级为确定性模拟数据
    real: ${WEATHER_REAL:false}
  mcp:
    # MCP（Model Context Protocol）工具生态：启动时把外部 MCP server 的工具注册进 ToolRegistry（只读，
    # 名称前缀 mcp_）。LLM 意图识别会把「查外部数据」路由到这些工具；未启用或未接入时 LLM 被提示禁用
    # INVOKE_TOOL，规则兜底路径也完全不受影响。单个 server 接入失败只告警，不影响应用。
    enabled: ${MCP_ENABLED:false}
    servers: []
    # 示例一：高德地图 MCP（stdio 子进程；Key 在 lbs.amap.com 免费申请，经环境变量注入，不落仓库）
    # servers:
    #   - name: amap
    #     command: ["cmd", "/c", "npx", "-y", "@amap/amap-maps-mcp-server"]   # Linux/Mac 去掉 cmd /c 前缀
    #     env: { AMAP_MAPS_API_KEYS: ${AMAP_KEY:} }
    # 示例二：streamable HTTP 远端 MCP server
    #   - name: wiki
    #     url: http://localhost:8807/mcp
  channels:
    # 多渠道入口：同一个 AgentEngine 同时服务网页与外部渠道，数据与账号体系完全一致。
    telegram:
      # BotFather 签发的 token（@BotFather /newbot 免费创建）。留空 = 渠道关闭；
      # 长轮询为纯出站连接，本地/内网可运行，无需公网回调。
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      poll-timeout-seconds: ${TELEGRAM_POLL_TIMEOUT:25}
    webhook:
      # 通用 Webhook 入口 POST /api/channels/webhook（X-Webhook-Secret 头即凭证，
      # 恒时比较）：给企业微信/钉钉/自建脚本等桥接用。需显式开启；未配置密钥时端点始终拒绝。
      enabled: ${CHANNEL_WEBHOOK_ENABLED:false}
      secret: ${CHANNEL_WEBHOOK_SECRET:}
    wechat:
      # 微信公众号渠道（明文模式）：公众号后台「服务器配置」填的 Token，留空 = 渠道关闭。
      # URL 填 https://<域名>/api/channels/wechat，Message 加解密选"明文模式"。
      # 被动回复窗口 5s：快路径实时回复；行程规划可能超窗（正式环境建议接客服消息异步回复）
      token: ${WECHAT_OA_TOKEN:}
  jwt:
    # Base64 编码的密钥（解码后长度必须 >= 32 字节）。
    # 必须通过环境变量注入；未配置时启动会生成一次性随机密钥（仅适合本地开发，重启后已签发 token 全部失效）。
    # 生成方式：openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expire-hours: ${JWT_EXPIRE_HOURS:72}
    # 登录 Cookie 是否带 Secure（https 部署时设 true；本地 http 开发保持 false）
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  llm:
    # 统一 LLM 接口：走 OpenAI-compatible API（DeepSeek / Qwen / OpenAI 均可）。
    # API Key 只能通过环境变量 LLM_API_KEY 注入，仓库内不得保留任何真实 Key。
    # 未配置或调用失败（如余额不足、网络异常）时自动降级为规则引擎，功能不受影响。
    enabled: ${LLM_ENABLED:true}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    temperature: ${LLM_TEMPERATURE:0.4}
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${LLM_READ_TIMEOUT_MS:30000}
    # 每用户每日 LLM 调用上限（意图识别/规划/润色/办公等全部计入）；0 = 不限制。
    # 超限自动降级规则引擎，体验无中断；计数落库（llm_quota_usage），多实例共享
    quota-daily-limit: ${LLM_DAILY_QUOTA:0}
  embedding:
    # 真实 Embedding：enabled=true 时 RAG 用 OpenAI 兼容 /embeddings 端点（SiliconFlow/智谱/OpenAI 等），
    # 失败进程内锁定降级为本地字符 bigram 哈希。切换模型后需清空 rag_document/rag_chunk 重建知识库
    enabled: ${EMBEDDING_ENABLED:false}
    base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}

logging:
  level:
    com.travel.agent: info
  pattern:
    # 日志带 traceId，便于把一次请求的多条日志串起来（响应头同名）
    level: "%5p [%X{traceId:-}]"
