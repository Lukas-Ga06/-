# 测试专用配置：内存数据库 + 关闭外部依赖，保证测试不触网、可重复运行
spring:
  datasource:
    url: jdbc:h2:mem:travel-agent-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

travel:
  jwt:
    # 仅用于测试的固定密钥（Base64，解码后 48 字节）；生产密钥一律通过环境变量注入
    secret: "zH5p+FxWgj8rMvkAbh49f7lG7jON+493C+/qTaxuJ4I92t+NNB0QA+fdyB4VQYf9"
    expire-hours: 1
  llm:
    # 测试中禁止调用真实大模型：走规则引擎兜底路径
    enabled: false
    api-key: ""
  amap:
    key: ""

logging:
  level:
    com.travel.agent: warn
